<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E8F0FE" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner concentric radar rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>

  <g>
    <!-- Central Beam Pulse -->
    <circle cx="256" cy="256" r="32" fill="#FFFFFF"/>
    <!-- Upper right beacon wave -->
    <path d="M296 216 C330 182 370 170 410 180" fill="none" stroke="url(#beamGrad)" stroke-width="18" stroke-linecap="round"/>
    <path d="M326 186 C370 142 420 130 460 150" fill="none" stroke="url(#beamGrad)" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
    <!-- Lower left beacon wave -->
    <path d="M216 296 C182 330 142 342 102 332" fill="none" stroke="url(#beamGrad)" stroke-width="18" stroke-linecap="round"/>
    <path d="M186 326 C142 370 92 382 52 362" fill="none" stroke="url(#beamGrad)" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
    <!-- Connected diagonal transfer trajectory -->
    <line x1="160" y1="352" x2="352" y2="160" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 16"/>
  </g>
</svg>
